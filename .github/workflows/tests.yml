name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The deployed app's dependencies plus pytest. Deliberately not
      # requirements-dev.txt: that pulls sounddevice, which needs PortAudio,
      # and none of the tests touch audio hardware.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Every test runs with no API key, no network and no audio device.
      - name: Test
        run: pytest -q
